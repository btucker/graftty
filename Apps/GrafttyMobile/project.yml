name: GrafttyMobile
options:
  bundleIdPrefix: net.graftty
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GrafttyMobileKit:
    path: ../..

targets:
  GrafttyMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GrafttyMobile
    settings:
      base:
        INFOPLIST_FILE: GrafttyMobile/Info.plist
        CODE_SIGN_ENTITLEMENTS: GrafttyMobile/GrafttyMobile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.quotably.graftty
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: 67APXH3J92
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    dependencies:
      - package: GrafttyMobileKit
        product: GrafttyMobileKit
      - target: GrafttyWatch
        embed: true

  GrafttyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - GrafttyWatch
    info:
      path: GrafttyWatch/Info.plist
      properties:
        CFBundleDisplayName: Graftty
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.quotably.graftty
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quotably.graftty.watchkitapp
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_IDENTITY[sdk=watchos*]: Apple Development
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: 67APXH3J92
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "4"
        SUPPORTED_PLATFORMS: "watchsimulator watchos"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    dependencies:
      - package: GrafttyMobileKit
        product: GrafttyWatchKit

  GrafttyMobileTestHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GrafttyMobileTestHost
    info:
      path: GrafttyMobileTestHost/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.10"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"

  GrafttyMobileInteractionHost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - GrafttyMobileTestHost
      - path: ../../Tests/GrafttyTests/AgentIntegration/AgentIntegrationWire.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.10"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GRAFTTY_BROWSER_CONTROL_FIXTURE"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    dependencies:
      - package: GrafttyMobileKit
        product: GrafttyMobileKit

  GrafttyMobileInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../Tests/GrafttyMobileInteractionTests
      - path: ../../Tests/GrafttyTests/AgentIntegration/AgentIntegrationWire.swift
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
    dependencies:
      - target: GrafttyMobileInteractionHost

  GrafttyMobileKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../Tests/GrafttyMobileKitTests
        excludes:
          - UI/HostBrowserProxyTests.swift
          - UI/ChromeTabViewerTests.swift
          - UI/RemoteBrowserButtonTests.swift
          - UI/WorktreeRowAlignmentTests.swift
          - Auth/VirtualClock.swift
          - App/IPadRootLayoutLandscapeTests.swift
          - App/LayoutPassProbe.swift
      - path: ../../Tests/GrafttyMobileKitTests/App/LayoutPassProbe.swift
        group: SharedTestSupport
      - path: ../../Tests/GrafttyMobileKitTests/Auth/VirtualClock.swift
        group: SharedTestSupport
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GRAFTTY_PAGED_HISTORY"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: GrafttyMobileKit
        product: GrafttyMobileKit
      - package: GrafttyMobileKit
        product: GrafttyRemoteTestSupport

  GrafttyMobileBrowserTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../Tests/GrafttyMobileKitTests/App/IPadRootLayoutLandscapeTests.swift
        group: GrafttyMobileBrowserTests
      - path: ../../Tests/GrafttyMobileKitTests/App/LayoutPassProbe.swift
        group: SharedTestSupport
      - path: ../../Tests/GrafttyMobileKitTests/UI/HostBrowserProxyTests.swift
        group: GrafttyMobileBrowserTests
      - path: ../../Tests/GrafttyMobileKitTests/UI/ChromeTabViewerTests.swift
        group: GrafttyMobileBrowserTests
      - path: ../../Tests/GrafttyMobileKitTests/UI/RemoteBrowserButtonTests.swift
        group: GrafttyMobileBrowserTests
      - path: ../../Tests/GrafttyMobileKitTests/Auth/VirtualClock.swift
        group: SharedTestSupport
      - path: ../../Tests/GrafttyMobileKitTests/UI/WorktreeRowAlignmentTests.swift
        group: GrafttyMobileBrowserTests
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: GrafttyMobileTestHost
      - package: GrafttyMobileKit
        product: GrafttyMobileKit

  GrafttyRemoteClientTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../Tests/GrafttyRemoteClientTests
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: GrafttyMobileKit
        product: GrafttyRemoteClient
      - package: GrafttyMobileKit
        product: GrafttyRemoteTestSupport

schemes:
  GrafttyWatch:
    build:
      targets:
        GrafttyWatch: all
    run:
      config: Debug
    archive:
      config: Release
  GrafttyBrowserInteraction:
    build:
      targets:
        GrafttyMobileInteractionHost: all
    test:
      config: Debug
      targets:
        - GrafttyMobileInteractionTests
  GrafttyMobile:
    build:
      targets:
        GrafttyMobile: all
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
      targets:
        - GrafttyMobileKitTests
        - GrafttyMobileBrowserTests
        - GrafttyRemoteClientTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
