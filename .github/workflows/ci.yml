name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web-client/pnpm-lock.yaml

      - name: Verify web-client bundle is up to date
        run: |
          ./scripts/build-web.sh
          git diff --exit-code Sources/GrafttyKit/Web/Resources/ \
            || { echo "::error::web-client/ changed but the committed bundle is stale. Run ./scripts/build-web.sh locally and recommit."; exit 1; }

  verify-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify SPECS.md is up to date
        run: |
          python3 scripts/generate-specs.py --check \
            || { echo "::error::SPECS.md is stale relative to @spec annotations. Run scripts/generate-specs.py locally and recommit."; exit 1; }

  macos-build-and-test:
    # macos-26 ships Xcode 26 which bundles a current swift-testing.
    # Run bounded chunks: the default swift-testing runner can leave the mixed
    # AppKit/NIO/process suite idling in the helper after a broad run, even when
    # all selected tests have passed. Fresh helper processes keep the gate useful.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build app + tests (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        timeout-minutes: 25
        run: scripts/run-swift-tests-ci.sh

      - name: Ownership model corpus gate
        timeout-minutes: 5
        # Runs the full OwnershipModelTests target: the committed 1000-seed
        # corpus, the 500-seed web sweep, the randomized Mac-gate sweep, the
        # non-vacuity guards, the seam/model tests, and the historical-regression
        # re-catch. Wide random batches (seeds > 1000) are intentionally excluded
        # — run those manually or as a nightly sweep.  The dedicated timeout above
        # is a canary: if the corpus slows past 5 min, investigate the root cause
        # rather than bumping it.
        run: /usr/bin/script -q /dev/null swift test --filter OwnershipModel --skip-build

  ios-build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate GrafttyMobile.xcodeproj
        working-directory: Apps/GrafttyMobile
        run: xcodegen generate

      # Cache the resolved SwiftPM sources (.spm) and the compiled
      # DerivedData (.derivedData). The bulk of the ~5-minute cold build
      # is recompiling the stable dependency graph (swift-nio, swift-crypto,
      # swift-certificates, GhosttyKit, MSDisplayLink, …), which only
      # changes when Package.resolved does. On a same-deps hit xcodebuild
      # reuses those artifacts and incrementally rebuilds just the
      # first-party targets that changed. Both dirs are pinned to fixed
      # workspace paths below — the default DerivedData path carries a
      # random suffix that would never cache-hit. Bump `v1` to bust.
      #
      # Restore + save are split (not the combined `actions/cache`) so the
      # save runs even when the build step fails: the iOS test suite is
      # flaky (real WebRTC loopback negotiations), and the combined action
      # skips its post-save on job failure — which would mean the cache
      # NEVER populates while a flake persists. The build artifacts are
      # valid regardless of whether a later test flaked, so we save on
      # `!cancelled()`.
      - name: Restore SPM / DerivedData cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .spm
            .derivedData
          key: ios-build-v1-${{ hashFiles('Package.resolved', 'Apps/GrafttyMobile/project.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v1-${{ hashFiles('Package.resolved', 'Apps/GrafttyMobile/project.yml') }}-

      - name: Build & test GrafttyMobile (iOS Simulator SDK)
        timeout-minutes: 15
        # Let xcodebuild apply the default simulator ad-hoc signature
        # (with application-identifier entitlement) — CODE_SIGN_IDENTITY=-
        # in project.yml handles signing. Without a real signature the
        # iOS Keychain rejects every SecItemAdd with errSecMissingEntitlement.
        run: |
          xcodebuild \
            -project Apps/GrafttyMobile/GrafttyMobile.xcodeproj \
            -scheme GrafttyMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath .derivedData \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test

      # Save whether or not the tests passed (see restore-step comment):
      # the build artifacts are valid regardless of a flaky test. Skip
      # only on an exact-key hit (a same-SHA rerun) where nothing changed.
      - name: Save SPM / DerivedData cache
        if: ${{ !cancelled() && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .spm
            .derivedData
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
