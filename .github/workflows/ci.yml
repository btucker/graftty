name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-build-and-test:
    uses: ./.github/workflows/linux.yml

  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web-client/pnpm-lock.yaml

      - name: Verify web-client bundle is up to date
        run: |
          ./scripts/build-web.sh
          git diff --exit-code Sources/GrafttyKit/Web/Resources/ \
            || { echo "::error::web-client/ changed but the committed bundle is stale. Run ./scripts/build-web.sh locally and recommit."; exit 1; }

      - name: Test web-client (vitest, including the host wire fixture)
        timeout-minutes: 5
        run: pnpm --dir web-client test

  verify-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify SPECS.md is up to date
        run: |
          python3 scripts/generate-specs.py --check \
            || { echo "::error::SPECS.md is stale relative to @spec annotations. Run scripts/generate-specs.py locally and recommit."; exit 1; }

      - name: Check Linux test allowlists
        run: |
          python3 -B scripts/check-linux-test-allowlist.py
          python3 -B -m unittest discover -s scripts -p 'test_check_linux_test_allowlist.py'

      - name: Test scripted agent protocols and action controller
        run: |
          python3 -B -m unittest discover -s scripts/agent-endpoint-spike -p 'test_*.py'
          python3 -B -m unittest discover -s scripts/agent-integration -p 'test_*.py'
          python3 -B scripts/ci/test_test_plan.py

  macos-build-and-test:
    # macos-26 ships Xcode 26 which bundles a current swift-testing.
    # The older swift-testing (124.4) on macos-latest (→ macos-15) has
    # an exit-path hang: all tests pass, then the process blocks ~10 min
    # without emitting the final summary. macos-26 sidesteps it.
    # Same-repo pushes and pull requests run on the self-hosted Mac
    # (mini-m1: self-hosted, macOS, ARM64) to avoid the hosted macOS
    # runner queue. Fork pull requests stay on the hosted image so
    # untrusted code never runs on the self-hosted machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork == true && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          # The id also hashes the absolute workspace: SwiftPM metadata and DerivedData
          # record absolute paths, so caches from another workspace (hosted vs
          # self-hosted, or two runner installs) must not be restored here.
          echo "id=$( { swift --version; xcodebuild -version; echo "$GITHUB_WORKSPACE"; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Test shared SwiftPM wrapper
        timeout-minutes: 2
        run: scripts/test-swiftpm-shared.sh

      - uses: ./.github/actions/paging-renderer
        env:
          # Persistent self-hosted hosts keep $HOME between jobs; an interrupted
          # renderer checkout there would poison every later build with the same
          # fingerprint. Keep the source cache job-owned (runner.temp is only
          # available at step level).
          GRAFTTY_GHOSTTY_BUILD_CACHE: ${{ runner.temp }}/ghostty-paging

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/workspace-state.json
          key: macos-deps-v3-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # workspace-state.json records which checkouts and binary artifacts are
      # extracted, so it lives with the dependency cache above. Restoring it
      # with compiled products while the dependency cache missed made SwiftPM
      # trust artifacts that were not there (Sparkle.xcframework Info.plist not
      # found) on every pull request whose dependency key was new.
      - name: Restore compiled SwiftPM build
        id: swift-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/*-apple-macosx
            .build/build.db
            .build/debug.yaml
          key: macos-build-v3-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/ghostty-paging/**') }}-${{ github.sha }}
          restore-keys: |
            macos-build-v3-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'scripts/ghostty-paging/**') }}-

      - name: Resolve Swift dependencies
        timeout-minutes: 5
        # Cached manifests can still trigger remote refreshes. Retry transient
        # fetch failures here, before the build, which must fail normally.
        run: |
          for attempt in 1 2 3; do
            if swift package resolve; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Swift dependency resolution failed after three attempts"
              exit 1
            fi
            echo "Swift dependency resolution failed; retrying in 5 seconds"
            sleep 5
          done

      - name: Build app + tests (warnings as errors)
        # Resolution above prepares the lockfile and sources. Avoid a second
        # remote refresh, and fail if the resolved graph unexpectedly changes.
        run: swift build --manifest-cache none -Xcc "$GRAFTTY_RENDERER_CONTEXT" --build-tests --disable-automatic-resolution -Xswiftc -warnings-as-errors

      - name: Save compiled SwiftPM build
        # Main writes rolling snapshots; pull requests only restore them.
        if: github.ref == 'refs/heads/main' && steps.swift-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/*-apple-macosx
            .build/build.db
            .build/debug.yaml
          key: ${{ steps.swift-build-cache.outputs.cache-primary-key }}

      - name: Test package targets in isolated processes
        # Preserve serial execution within bounded processes, but anchor suite
        # boundaries so similarly named suites cannot run in multiple batches.
        timeout-minutes: 20
        run: python3 -B scripts/ci/run-macos-tests.py

      - name: Upload Mac test selection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-selection
          path: .ci-results/macos
          include-hidden-files: true
          retention-days: 7

      - name: Ownership model corpus gate
        timeout-minutes: 5
        # Runs the full OwnershipModelTests target: the committed 1000-seed
        # corpus, the 500-seed web sweep, the randomized Mac-gate sweep, the
        # non-vacuity guards, the seam/model tests, and the historical-regression
        # re-catch. Wide random batches (seeds > 1000) are intentionally excluded
        # — run those manually or as a nightly sweep.  The dedicated timeout above
        # is a canary: if the corpus slows past 5 min, investigate the root cause
        # rather than bumping it.
        run: /usr/bin/script -q /dev/null swift test -Xcc "$GRAFTTY_RENDERER_CONTEXT" --filter OwnershipModel --skip-build

  ios-test-shards:
    name: ios-test (${{ matrix.shard }})
    runs-on: ${{ github.event.pull_request.head.repo.fork == true && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # Compare one build/boot/runner with the previous [unit, integration]
        # layout while retaining all four test processes and selections.
        shard: [all]
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        id: toolchain
        run: |
          swift --version
          xcodebuild -version
          # The id also hashes the absolute workspace: SwiftPM metadata and DerivedData
          # record absolute paths, so caches from another workspace (hosted vs
          # self-hosted, or two runner installs) must not be restored here.
          echo "id=$( { swift --version; xcodebuild -version; echo "$GITHUB_WORKSPACE"; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/paging-renderer
        env:
          # Persistent self-hosted hosts keep $HOME between jobs; an interrupted
          # renderer checkout there would poison every later build with the same
          # fingerprint. Keep the source cache job-owned (runner.temp is only
          # available at step level).
          GRAFTTY_GHOSTTY_BUILD_CACHE: ${{ runner.temp }}/ghostty-paging

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate GrafttyMobile.xcodeproj
        working-directory: Apps/GrafttyMobile
        run: xcodegen generate

      # Build and boot once for unit tests and all three integration groups.
      # Each group still runs in a separate xcodebuild process.
      - name: Cache iOS SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: ios-deps-v2-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Apps/GrafttyMobile/project.yml') }}

      - name: Restore iOS compiled build
        id: ios-build-cache
        uses: actions/cache/restore@v4
        with:
          path: .derivedData
          key: ios-build-v5-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Apps/GrafttyMobile/project.yml', 'scripts/ghostty-paging/**') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v5-${{ runner.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Apps/GrafttyMobile/project.yml', 'scripts/ghostty-paging/**') }}-

      - name: Build GrafttyMobile for testing (iOS Simulator SDK)
        timeout-minutes: 10
        # Let xcodebuild apply the default simulator ad-hoc signature
        # (with application-identifier entitlement) — CODE_SIGN_IDENTITY=-
        # in project.yml handles signing. Without a real signature the
        # iOS Keychain rejects every SecItemAdd with errSecMissingEntitlement.
        run: |
          # shellcheck disable=SC2016 # Xcode expands $(inherited).
          xcodebuild \
            -project Apps/GrafttyMobile/GrafttyMobile.xcodeproj \
            -scheme GrafttyMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath .derivedData \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) DEBUG GRAFTTY_PAGED_HISTORY' \
            "OTHER_SWIFT_FLAGS=\$(inherited) -Xcc $GRAFTTY_RENDERER_CONTEXT" \
            build-for-testing

      - name: Save iOS compiled build
        # The all/unit runner writes after a successful build; tests always run.
        # Integration never writes if the two-runner layout is restored.
        if: github.ref == 'refs/heads/main' && matrix.shard != 'integration' && steps.ios-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .derivedData
          key: ${{ steps.ios-build-cache.outputs.cache-primary-key }}

      - name: Create isolated iOS simulator
        timeout-minutes: 12
        run: |
          SIMULATOR_UDID="$(xcrun simctl create "Graftty CI (${{ matrix.shard }})" "iPhone 17")"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test GrafttyMobile shard without rebuilding
        timeout-minutes: 20
        env:
          SHARD_NAME: ${{ matrix.shard }}
        run: |
          TEST_ARGUMENTS="$(python3 -B scripts/ci/test_plan.py "$SHARD_NAME")"
          export TEST_ARGUMENTS
          scripts/run-ios-test-shard.sh

      - name: Delete the CI simulator
        # Hosted VMs discarded leaked simulators; a persistent self-hosted host
        # would accumulate them when boot or the test step fails before the
        # shard script's own trap runs. Only this job's UDID is touched.
        if: always() && env.SIMULATOR_UDID != ''
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" >/dev/null 2>&1 || true
          xcrun simctl delete "$SIMULATOR_UDID" >/dev/null 2>&1 || true

      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ matrix.shard }}
          path: .ci-results/ios
          include-hidden-files: true
          retention-days: 7

  # Preserve the original required-check name across both complete runners.
  ios-build-and-test:
    if: ${{ always() }}
    needs: ios-test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Verify every iOS build and test shard succeeded
        env:
          TEST_RESULT: ${{ needs.ios-test-shards.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "::error::iOS build/test matrix result: $TEST_RESULT"
            exit 1
          fi
