name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web-client/pnpm-lock.yaml

      - name: Verify web-client bundle is up to date
        run: |
          ./scripts/build-web.sh
          git diff --exit-code Sources/GrafttyKit/Web/Resources/ \
            || { echo "::error::web-client/ changed but the committed bundle is stale. Run ./scripts/build-web.sh locally and recommit."; exit 1; }

  verify-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify SPECS.md is up to date
        run: |
          python3 scripts/generate-specs.py --check \
            || { echo "::error::SPECS.md is stale relative to @spec annotations. Run scripts/generate-specs.py locally and recommit."; exit 1; }

  macos-build-and-test:
    # macos-26 ships Xcode 26 which bundles a current swift-testing.
    # The older swift-testing (124.4) on macos-latest (→ macos-15) has
    # an exit-path hang: all tests pass, then the process blocks ~10 min
    # without emitting the final summary. macos-26 sidesteps it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test shared SwiftPM wrapper
        timeout-minutes: 2
        run: scripts/test-swiftpm-shared.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build app + tests (warnings as errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test package targets in isolated processes
        timeout-minutes: 5
        # `script` gives swift test a PTY-like stdout so output streams
        # in real time instead of being block-buffered by the CI log pipe.
        # A package-wide invocation intermittently stalls while the many async,
        # subprocess, WebRTC, and socket suites contend in one test process.
        # Launch one process per target while reusing the preceding build.
        #
        # SwiftPM's target-qualified --filter is honored by XCTest but stripped
        # before Swift Testing runs; using it alone makes Swift Testing execute
        # the ENTIRE package once per target. Build a suite-name filter from
        # `swift test list` for Swift Testing, and run XCTest separately with
        # its target-qualified filter. OwnershipModelTests keeps its dedicated
        # corpus gate below.
        run: |
          set -o pipefail
          test_targets="$(
            swift package describe --type json \
              | jq -r '.targets[] | select(.type == "test" and .name != "OwnershipModelTests") | .c99name'
          )"
          if [[ -z "$test_targets" ]]; then
            echo "::error::No non-ownership Swift test targets were discovered"
            exit 1
          fi

          test_list="$(swift test list --skip-build)"
          while IFS= read -r target; do
            echo "::group::$target"
            suite_names="$(
              awk -v prefix="${target}." '
                index($0, prefix) == 1 {
                  name = substr($0, length(prefix) + 1)
                  sub(/\/.*/, "", name)
                  print name
                }
              ' <<< "$test_list" \
                | sort -u \
                | sed 's/[][(){}.^$*+?|\\]/\\&/g'
            )"

            # Keep regexes below Swift Testing's practical argument-size
            # ceiling and serialize within each process. Several NIO server
            # suites synchronously join event-loop shutdown from cooperative
            # tasks; unbounded Swift Testing parallelism can park the entire
            # cooperative pool in those joins.
            suite_filter=""
            suite_count=0
            while IFS= read -r suite; do
              [[ -z "$suite" ]] && continue
              if [[ -n "$suite_filter" ]]; then
                suite_filter="${suite_filter}|${suite}"
              else
                suite_filter="$suite"
              fi
              suite_count=$((suite_count + 1))
              if [[ "$suite_count" -eq 20 ]]; then
                /usr/bin/script -q /dev/null \
                  swift test --skip-build --disable-xctest --no-parallel \
                    --filter "(${suite_filter})" \
                  < /dev/null
                suite_filter=""
                suite_count=0
              fi
            done <<< "$suite_names"
            if [[ -n "$suite_filter" ]]; then
              /usr/bin/script -q /dev/null \
                swift test --skip-build --disable-xctest --no-parallel \
                  --filter "(${suite_filter})" \
                < /dev/null
            fi
            /usr/bin/script -q /dev/null \
              swift test --skip-build --disable-swift-testing \
                --filter "^${target}\\." \
              < /dev/null
            echo "::endgroup::"
          done <<< "$test_targets"

      - name: Ownership model corpus gate
        timeout-minutes: 5
        # Runs the full OwnershipModelTests target: the committed 1000-seed
        # corpus, the 500-seed web sweep, the randomized Mac-gate sweep, the
        # non-vacuity guards, the seam/model tests, and the historical-regression
        # re-catch. Wide random batches (seeds > 1000) are intentionally excluded
        # — run those manually or as a nightly sweep.  The dedicated timeout above
        # is a canary: if the corpus slows past 5 min, investigate the root cause
        # rather than bumping it.
        run: /usr/bin/script -q /dev/null swift test --filter OwnershipModel --skip-build

  ios-build-for-testing:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate GrafttyMobile.xcodeproj
        working-directory: Apps/GrafttyMobile
        run: xcodegen generate

      # Cache the resolved SwiftPM sources (.spm) and compiled DerivedData
      # (.derivedData). The exact-SHA cache written by this job is also the
      # handoff to the test shards below: build the app and test bundle once,
      # then let four fresh runners restore those products and test without
      # rebuilding. Both dirs are pinned to fixed workspace paths because the
      # default DerivedData path carries a random suffix that would never
      # cache-hit. Bump `v2` to bust.
      #
      # Restore + save are split (not the combined `actions/cache`) so the
      # build products are available to downstream jobs before they start.
      - name: Restore SPM / DerivedData cache
        id: spm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .spm
            .derivedData
          key: ios-build-v2-${{ hashFiles('Package.resolved', 'Apps/GrafttyMobile/project.yml') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v2-${{ hashFiles('Package.resolved', 'Apps/GrafttyMobile/project.yml') }}-

      - name: Build GrafttyMobile for testing (iOS Simulator SDK)
        timeout-minutes: 10
        # Let xcodebuild apply the default simulator ad-hoc signature
        # (with application-identifier entitlement) — CODE_SIGN_IDENTITY=-
        # in project.yml handles signing. Without a real signature the
        # iOS Keychain rejects every SecItemAdd with errSecMissingEntitlement.
        run: |
          xcodebuild \
            -project Apps/GrafttyMobile/GrafttyMobile.xcodeproj \
            -scheme GrafttyMobile \
            -sdk iphonesimulator \
            -configuration Debug \
            -skipPackagePluginValidation \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath .derivedData \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build-for-testing

      - name: Save SPM / DerivedData cache
        # Never publish partial DerivedData from a failed build: a later
        # restore-key match would otherwise spread the bad handoff.
        if: ${{ success() && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .spm
            .derivedData
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

  ios-test-shards:
    name: ios-test (${{ matrix.shard }})
    needs: ios-build-for-testing
    runs-on: macos-26
    # Fresh simulator boot can spend several minutes in Apple data migration.
    # Give provisioning and testing independent canaries below; this outer
    # ceiling only catches a job that overruns both budgets plus setup time.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ordinary unit suites finish in about a minute. The remaining
          # shards balance the real WebRTC/SSH integration suites using recent
          # CI timings. Their suite-level `.serialized` traits remain intact;
          # isolation comes from running each shard on its own macOS runner.
          - shard: unit
            test-arguments: >-
              -skip-testing:GrafttyMobileKitTests/RemoteConnectionCoordinatorTests
              -skip-testing:GrafttyMobileKitTests/RemoteConnectionReconnectTests
              -skip-testing:GrafttyRemoteClientTests/RemoteHostConnectionLoopbackTests
              -skip-testing:GrafttyRemoteClientTests/SSHAuthLoopbackTests
              -skip-testing:GrafttyRemoteClientTests/SSHOverWebRTCLoopbackTests
              -skip-testing:GrafttyRemoteClientTests/SSHPanesAndControlLoopbackTests
              -skip-testing:GrafttyRemoteClientTests/SSHTerminalLoopbackTests
          - shard: coordinator
            test-arguments: >-
              -only-testing:GrafttyMobileKitTests/RemoteConnectionCoordinatorTests
          - shard: ssh-auth-terminal
            test-arguments: >-
              -only-testing:GrafttyRemoteClientTests/SSHAuthLoopbackTests
              -only-testing:GrafttyRemoteClientTests/SSHTerminalLoopbackTests
          - shard: remote-loopbacks
            test-arguments: >-
              -only-testing:GrafttyMobileKitTests/RemoteConnectionReconnectTests
              -only-testing:GrafttyRemoteClientTests/RemoteHostConnectionLoopbackTests
              -only-testing:GrafttyRemoteClientTests/SSHOverWebRTCLoopbackTests
              -only-testing:GrafttyRemoteClientTests/SSHPanesAndControlLoopbackTests
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact build-for-testing products
        uses: actions/cache/restore@v4
        with:
          path: |
            .spm
            .derivedData
          key: ios-build-v2-${{ hashFiles('Package.resolved', 'Apps/GrafttyMobile/project.yml') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Create isolated iOS simulator
        timeout-minutes: 12
        run: |
          SIMULATOR_UDID="$(xcrun simctl create "Graftty CI (${{ matrix.shard }})" "iPhone 17")"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Test GrafttyMobile shard without rebuilding
        timeout-minutes: 15
        env:
          SHARD_NAME: ${{ matrix.shard }}
          TEST_ARGUMENTS: ${{ matrix.test-arguments }}
        run: scripts/run-ios-test-shard.sh

  # Preserve the original required-check name while the implementation runs
  # as one build job plus a test matrix.
  ios-build-and-test:
    if: ${{ always() }}
    needs:
      - ios-build-for-testing
      - ios-test-shards
    runs-on: ubuntu-latest
    steps:
      - name: Verify every iOS build and test shard succeeded
        env:
          BUILD_RESULT: ${{ needs.ios-build-for-testing.result }}
          TEST_RESULT: ${{ needs.ios-test-shards.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "::error::iOS build result: $BUILD_RESULT; test matrix result: $TEST_RESULT"
            exit 1
          fi
