name: Native agent integration

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Deterministic action seed
        default: '1'
        required: true
      actions:
        description: Generated actions after the fixed regressions
        default: '60'
        required: true
      history:
        description: Run the focused dense history paging regression on both providers
        type: boolean
        default: false
      worktree_creation:
        description: Test background creation, Mobile layout, and resize stability
        type: boolean
        default: false
      creation_source:
        description: Background startup boundary to exercise
        type: choice
        options: [cli, app-flow]
        default: cli
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: read

concurrency:
  group: native-agent-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-agents:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Validate standalone scenario selection
        if: inputs.history && inputs.worktree_creation
        run: |
          echo 'Select history or worktree_creation in separate workflow runs.'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/paging-renderer
      - name: Install pinned provider CLIs
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-clients" \
            @openai/codex@0.162.1 @anthropic-ai/claude-code@2.1.296
          "$RUNNER_TEMP/agent-clients/node_modules/.bin/codex" --version
          "$RUNNER_TEMP/agent-clients/node_modules/.bin/claude" --version
      - name: Build Graftty CLI
        run: scripts/swiftpm build --build-system native --product graftty-cli
      - name: Verify history regression RED and GREEN
        if: inputs.history
        shell: bash
        run: |
          mkdir -p /private/tmp/graftty-history-validation
          candidate="$RUNNER_TEMP/history-candidate-zmx"
          cp Resources/zmx-binary/zmx "$candidate"
          trap 'cp "$candidate" Resources/zmx-binary/zmx' EXIT
          git fetch --depth=1 origin 16287dce6ae591201092efa52c8f98bf6628cf8e
          git show 16287dce6ae591201092efa52c8f98bf6628cf8e:Resources/zmx-binary/zmx > Resources/zmx-binary/zmx
          if scripts/swiftpm test --build-system native --filter denseWideHistoryPagesStayBoundedAndRecover > /private/tmp/graftty-history-validation/red.log 2>&1; then
            echo 'History regression unexpectedly passed against graftty6'
            exit 1
          fi
          grep -q 'Dense history must arrive as a bounded page, not a host limit refusal' /private/tmp/graftty-history-validation/red.log
          export GRAFTTY_HISTORY_LEGACY_ZMX="$RUNNER_TEMP/history-legacy-zmx"
          cp Resources/zmx-binary/zmx "$GRAFTTY_HISTORY_LEGACY_ZMX"
          cp "$candidate" Resources/zmx-binary/zmx
          scripts/swiftpm test --build-system native --filter 'MacPagedTerminalTests|PagedTerminalCoordinatorTests' 2>&1 | tee /private/tmp/graftty-history-validation/green.log
          python3 -B scripts/agent-integration/verify_history_results.py --swift /private/tmp/graftty-history-validation
      - name: Prove headless worktree prompt staging RED and GREEN
        if: inputs.worktree_creation
        run: |
          python3 -B scripts/agent-integration/worktree_startup.py \
            --output "$RUNNER_TEMP/worktree-startup" --baseline 16287dce
      - name: Prove Mobile worktree UI regressions RED and GREEN
        id: worktree-ui
        if: inputs.worktree_creation
        run: |
          python3 -B scripts/agent-integration/worktree_ui.py \
            --output "$RUNNER_TEMP/worktree-ui" \
            --derived-data "$RUNNER_TEMP/worktree-ui-derived" \
            --baseline 16287dce
      - name: Preserve creation regression evidence before provider scenarios
        if: always() && inputs.worktree_creation
        uses: actions/upload-artifact@v4
        with:
          name: worktree-regressions-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/worktree-ui
            ${{ runner.temp }}/worktree-startup
      - name: Run real agents on Mac and mobile
        # Preserve independent provider evidence after a UI or upload failure;
        # the source-restoration gate below still fails closed before building.
        if: success() || (inputs.worktree_creation && (steps.worktree-ui.outcome == 'success' || steps.worktree-ui.outcome == 'failure'))
        env:
          TEST_SEED: ${{ inputs.seed || github.run_number }}
          TEST_ACTIONS: ${{ inputs.actions || '60' }}
          TEST_HISTORY: ${{ inputs.history || 'false' }}
          TEST_WORKTREE_CREATION: ${{ inputs.worktree_creation || 'false' }}
          TEST_CREATION_SOURCE: ${{ inputs.creation_source || 'cli' }}
        run: |
          cli="$HOME/Library/Caches/Graftty/SwiftPM/build/$(uname -m)-apple-macosx/debug/graftty-cli"
          scenario=()
          if [[ "$TEST_HISTORY" == true ]]; then scenario=(--history --rows 600); fi
          if [[ "$TEST_WORKTREE_CREATION" == true ]]; then
            python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence = json.loads((Path(os.environ['RUNNER_TEMP']) / 'worktree-ui/result.json').read_text())
          if not evidence.get('sourceRestored'):
              raise SystemExit('UI baseline source restoration was not established; refusing native run')
          for name, expected in evidence['currentSourceHashes'].items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Source changed after restoration: ' + name)
          PY
            scenario+=(--worktree-creation --worktree-creation-source "$TEST_CREATION_SOURCE")
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/native-tested-commit.txt"
          shasum -a 256 "$cli" Resources/zmx-binary/zmx > "$RUNNER_TEMP/native-binaries.txt"
          xcrun simctl list devices --json > "$RUNNER_TEMP/native-simulators.json"
          runner=(python3 -B scripts/agent-integration/run.py \
            --codex "$RUNNER_TEMP/agent-clients/node_modules/.bin/codex" \
            --claude "$RUNNER_TEMP/agent-clients/node_modules/.bin/claude" \
            --cli "$cli" --zmx "$PWD/Resources/zmx-binary/zmx" \
            --ghostty-package "$PWD/.dependencies/libghostty-spm" \
            --seed "$TEST_SEED" --actions "$TEST_ACTIONS")
          status=0
          "${runner[@]}" "${scenario[@]}" || status=$?
          if [[ "$TEST_WORKTREE_CREATION" == true ]]; then
            "${runner[@]}" "${scenario[@]}" --worktree-creation-viewport-only || status=$?
          fi
          exit "$status"
      - name: Require passing Mobile worktree UI evidence
        if: always() && inputs.worktree_creation
        run: |
          python3 - <<'PY_EVIDENCE'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'worktree-ui'
          evidence = json.loads((root / 'result.json').read_text())
          if evidence.get('result') != 'passed' or not evidence.get('sourceRestored'):
              raise SystemExit('Mobile UI RED/GREEN evidence did not pass or source was not restored')
          for name in ('red', 'green'):
              phase = evidence[name]
              if not phase.get('passed') or not (root / name / 'tests.xcresult').is_dir():
                  raise SystemExit('Missing passing native phase evidence: ' + name)
              images = phase.get('renders', {}).get('images', [])
              if not images or any(not (root / name / image).is_file() for image in images):
                  raise SystemExit('Missing native render evidence: ' + name)
          PY_EVIDENCE
      - name: Require complete history scenario results
        if: inputs.history
        run: python3 -B scripts/agent-integration/verify_history_results.py --results /private/tmp/graftty-ai-*/result.json
      - name: Preserve native failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-agent-integration-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/worktree-ui
            ${{ runner.temp }}/worktree-startup
            ${{ runner.temp }}/native-*.txt
            ${{ runner.temp }}/native-simulators.json
            /private/tmp/graftty-ai-*/*stability.json
            /private/tmp/graftty-ai-*/*created-pane*.json
            /private/tmp/graftty-ai-*/*creation*.txt
            /private/tmp/graftty-ai-*/*creation-hooks.json
            /private/tmp/graftty-ai-*/*creation-completion-notice.json
            /private/tmp/graftty-ai-*/*production-startup.json
            /private/tmp/graftty-ai-*/*.png
            /private/tmp/graftty-ai-*/*failure.json
            /private/tmp/graftty-ai-*/result.json
            /private/tmp/graftty-ai-*/source.diff
            /private/tmp/graftty-ai-*/actions.json
            /private/tmp/graftty-ai-*/trace.jsonl
            /private/tmp/graftty-ai-*/mac.log
            /private/tmp/graftty-ai-*/mobile.log
            /private/tmp/graftty-ai-*/simulator-boot.log
            /private/tmp/graftty-ai-*/ios-build.log
            /private/tmp/graftty-ai-*/mobile.xcresult
            /private/tmp/graftty-ai-*/history-*.json
            /private/tmp/graftty-history-validation/*.log
