name: Select published paging renderer
description: Use the same pinned paging package as development and release builds.
runs:
  using: composite
  steps:
    - name: Select published paging renderer
      shell: bash
      run: |
        # An inherited dependency-development override must not change CI's package.
        unset GRAFTTY_GHOSTTY_PACKAGE_PATH
        echo 'GRAFTTY_GHOSTTY_PACKAGE_PATH=' >> "$GITHUB_ENV"
        echo 'GRAFTTY_REQUIRE_PAGED_HISTORY=1' >> "$GITHUB_ENV"
        context="$(python3 scripts/ghostty-paging/compiler-context.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/graftty-manifest")"
        echo "GRAFTTY_RENDERER_CONTEXT=$context" >> "$GITHUB_ENV"
